# Nome do workflow, focado em CI e validações
name: Go Backend CI

# Gatilhos: Roda em pushes e pull requests para as branches 'develop' e 'main'
on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:

  ci-checks:
    name: Validate, Test, Lint & Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Branch Name
        if: github.event_name == 'pull_request'
        run: |
          # Pega o nome da branch de origem do PR
          BRANCH_NAME="${{ github.head_ref }}"
          # Regex que exige um dos prefixos seguido de uma barra
          REGEX="^(feat|feature|bugfix|hotfix)\/[a-z0-9._-]+$"
          
          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "ERRO: O nome da branch '$BRANCH_NAME' não segue o padrão exigido."
            echo "Use um dos prefixos: feat/, feature/, bugfix/, hotfix/"
            exit 1
          fi
          
          echo "Nome da branch '$BRANCH_NAME' é válido."

      - name: Validate Commit Messages
        if: github.event_name == 'pull_request'
        run: |
          # Instala o 'jq' para processar o JSON da API do GitHub
          sudo apt-get -y install jq
          
          # Regex que exige 'tipo(servico): descricao'
          REGEX="^(feat|feature|bugfix|hotfix|chore|docs|style|refactor|test)\([a-z0-9-]+\): .+"
          
          # Pega as mensagens de commit do PR através da API do GitHub
          COMMITS_URL="${{ github.event.pull_request.commits_url }}"
          COMMIT_MESSAGES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$COMMITS_URL" | jq -r '.[].commit.message')
          
          echo "Verificando as seguintes mensagens de commit:"
          echo "$COMMIT_MESSAGES"
          
          # Itera sobre cada mensagem e valida
          while IFS= read -r message; do
            if [[ ! "$message" =~ $REGEX ]]; then
              echo "------------------------------------------------"
              echo "ERRO: A mensagem de commit a seguir é inválida:"
              echo "'$message'"
              echo "------------------------------------------------"
              echo "A mensagem deve seguir o padrão 'tipo(servico): descrição'."
              echo "O escopo (nome do serviço) entre parênteses é obrigatório."
              echo "Exemplo válido: feat(servico-usuarios): adicionar endpoint de login"
              exit 1
            fi
          done <<< "$COMMIT_MESSAGES"
          
          echo "------------------------------------------------"
          echo "Todas as mensagens de commit são válidas."

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run linter
        uses: golangci/golangci-lint-action@v6

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Scan for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...